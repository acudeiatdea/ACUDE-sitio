    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    @keyframes pulse-gold {
      0%, 100% { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">
  <header class="bg-slate-900/90 backdrop-blur border-b border-emerald-900/60 px-3 py-2.5 sm:px-6 sm:py-3 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-emerald-600 flex items-center justify-center text-lg sm:text-xl shadow-lg shadow-emerald-900/50">🌿</div>
        <div>
          <h1 class="text-sm sm:text-lg font-black tracking-tight bg-gradient-to-r from-emerald-400 via-teal-300 to-amber-300 bg-clip-text text-transparent">MILLONARIO BOTÁNICO</h1>
          <p class="text-[10px] sm:text-xs text-slate-400">TdeA · Botánica 2026</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleMobileLadder()" class="lg:hidden px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-amber-300 flex items-center gap-1">🪜 <span>Niveles</span></button>
        <button id="soundToggle" onclick="toggleSound()" class="p-1.5 sm:px-2.5 sm:py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs border border-slate-700 text-slate-300">🔊</button>
      </div>
    </div>
  </header>
  <main class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-5 grid grid-cols-1 lg:grid-cols-4 gap-4 sm:gap-6">
    <div class="lg:col-span-3 flex flex-col justify-between gap-3 sm:gap-4">
      <div class="bg-slate-900/70 p-3 sm:p-4 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-2 shadow-lg">
        <div class="flex items-center gap-1.5 sm:gap-2">
          <span class="text-[11px] font-bold text-slate-400 uppercase hidden sm:inline">Comodines:</span>
          <button id="life5050" onclick="use5050()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 border border-indigo-700/80 text-indigo-200 text-xs font-bold shadow">50:50</button>
          <button id="lifePhone" onclick="usePhone()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-700/80 text-emerald-200 text-xs font-bold shadow">📞 Compañera</button>
          <button id="lifePublic" onclick="usePublic()" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-amber-950/80 hover:bg-amber-900 border border-amber-700/80 text-amber-200 text-xs font-bold shadow">📊 Público</button>
        </div>
        <div class="text-right">
          <span class="text-[10px] uppercase text-slate-400 block font-semibold">Premio Actual</span>
          <span id="currentPrize" class="text-sm sm:text-base font-extrabold text-amber-400">$0</span>
        </div>
      </div>
      <div id="questionContainer" class="bg-gradient-to-b from-slate-900 to-slate-950 p-4 sm:p-6 rounded-2xl border-2 border-amber-500/40 shadow-2xl flex flex-col justify-between min-h-[140px] sm:min-h-[180px]">
        <div class="flex justify-between items-center mb-2">
          <span id="questionTopic" class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2 py-0.5 rounded">TEMA</span>
          <span id="questionNumber" class="text-xs font-bold text-slate-400">Nivel 1 / 15</span>
        </div>
        <h2 id="questionText" class="text-sm sm:text-lg md:text-xl font-medium text-slate-100 my-auto py-2 leading-snug">Cargando pregunta...</h2>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3.5">
        <button id="opt0" onclick="chooseOption(0)" class="btn-opt text-left p-3 sm:p-4 rounded-xl border border-slate-700 flex items-center gap-2.5"><span class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-amber-500/20 text-amber-300 font-bold flex items-center justify-center border border-amber-500/30 text-xs sm:text-sm shrink-0">A</span><span class="text-xs sm:text-sm text-slate-200 leading-snug" id="optText0">Opción A</span></button>
        <button id="opt1" onclick="chooseOption(1)" class="btn-opt text-left p-3 sm:p-4 rounded-xl border border-slate-700 flex items-center gap-2.5"><span class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-amber-500/20 text-amber-300 font-bold flex items-center justify-center border border-amber-500/30 text-xs sm:text-sm shrink-0">B</span><span class="text-xs sm:text-sm text-slate-200 leading-snug" id="optText1">Opción B</span></button>
        <button id="opt2" onclick="chooseOption(2)" class="btn-opt text-left p-3 sm:p-4 rounded-xl border border-slate-700 flex items-center gap-2.5"><span class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-amber-500/20 text-amber-300 font-bold flex items-center justify-center border border-amber-500/30 text-xs sm:text-sm shrink-0">C</span><span class="text-xs sm:text-sm text-slate-200 leading-snug" id="optText2">Opción C</span></button>
        <button id="opt3" onclick="chooseOption(3)" class="btn-opt text-left p-3 sm:p-4 rounded-xl border border-slate-700 flex items-center gap-2.5"><span class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-amber-500/20 text-amber-300 font-bold flex items-center justify-center border border-amber-500/30 text-xs sm:text-sm shrink-0">D</span><span class="text-xs sm:text-sm text-slate-200 leading-snug" id="optText3">Opción D</span></button>
      </div>
      <div id="feedbackBox" class="hidden bg-slate-900 border border-slate-700 rounded-xl p-3.5 sm:p-4 shadow-xl">
        <h4 id="feedbackTitle" class="font-bold text-xs sm:text-sm mb-1"></h4>
        <p id="feedbackText" class="text-xs sm:text-sm text-slate-300 mb-3 leading-relaxed"></p>
        <button id="nextBtn" onclick="nextQuestion()" class="w-full sm:w-auto px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm shadow">Siguiente Pregunta ➔</button>
      </div>
    </div>
    <div id="ladderSidebar" class="hidden lg:flex fixed lg:static inset-0 bg-slate-950/95 lg:bg-slate-900/90 z-50 lg:z-auto p-4 sm:p-5 rounded-2xl border border-slate-800 flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400">Escalera de Niveles</h3>
          <button onclick="toggleMobileLadder()" class="lg:hidden text-slate-400 hover:text-white text-lg p-1">✕</button>
        </div>
        <div id="ladderContainer" class="flex flex-col-reverse gap-1 text-[11px] sm:text-xs"></div>
      </div>
      <div class="mt-4 p-2.5 bg-slate-950 rounded-xl border border-slate-800 text-[10px] sm:text-[11px] text-slate-400">
        🛡️ <strong class="text-amber-300">Zonas Seguras:</strong> Niveles 5 ($1,000) y 10 ($32,000).
      </div>
    </div>
  </main>
  <div id="modalOverlay" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modalCard" class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm sm:max-w-md w-full p-5 sm:p-6 text-center shadow-2xl">
      <h3 id="modalTitle" class="text-base sm:text-xl font-bold mb-2 text-amber-400">Título</h3>
      <div id="modalBody" class="text-xs sm:text-sm text-slate-300 mb-5 leading-relaxed">Contenido</div>
      <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 font-bold text-xs sm:text-sm">Continuar al Juego</button>
    </div>
  </div>
  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let soundEnabled = true;
    function playTone(freq, type, duration, delay=0) {
      if (!soundEnabled) return;
      setTimeout(() => {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }, delay);
    }
    function soundCorrect() {
      playTone(523.25, 'triangle', 0.12, 0);
      playTone(659.25, 'triangle', 0.12, 100);
      playTone(783.99, 'triangle', 0.25, 200);
      playTone(1046.5, 'sine', 0.4, 300);
    }
    function soundWrong() {
      playTone(200, 'sawtooth', 0.25, 0);
      playTone(150, 'sawtooth', 0.45, 200);
    }
    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').innerText = soundEnabled ? "🔊" : "🔇";
    }
    function toggleMobileLadder() {
      const el = document.getElementById('ladderSidebar');
      el.classList.toggle('hidden');
      el.classList.toggle('flex');
    }
    const questions = [
      { topic: "Ramas de la Botánica", q: "¿Qué disciplina de la botánica se encarga de analizar cómo las células vegetales se agrupan, diferencian y organizan para constituir tejidos funcionales?", opts: ["Citología", "Histología", "Fitografía", "Fitogeografía"], correct: 1, exp: "La Histología estudia la especialización tisular. La Citología se enfoca en la célula individual y la Fitografía en la descripción para taxonomía." },
      { topic: "Evolución y Fotosíntesis", q: "La primera célula vegetal fotosintética evolucionó gracias a un proceso de endosimbiosis entre un protozoo heterótrofo y:", opts: ["Una alfa-proteobacteria", "Un hongo ascomiceto", "Una cianobacteria", "Una arquea termófila"], correct: 2, exp: "La endosimbiosis con una cianobacteria dio origen a los cloroplastos. La previa con alfa-proteobacteria originó la mitocondria." },
      { topic: "Citología Vegetal", q: "¿Qué estructura u orgánulo vegetal es el responsable directo de acumular agua y solutos para generar la presión de turgencia celular?", opts: ["Vacuola central", "Aparato de Golgi", "Peroxisoma", "Retículo endoplasmático rugoso"], correct: 0, exp: "La vacuola central mantiene el volumen hidrosalino y empuja contra la pared celular para sostener mecánicamente los tejidos blandos." },
      { topic: "Colonización Terrestre", q: "Entre las adaptaciones morfofisiológicas críticas que permitieron a las primeras plantas (briofitas y Cooksonia) colonizar la tierra firme destaca:", opts: ["Desarrollo de flores trímeras", "Formación de cutícula cerosa y estomas", "Aparición de madera secundaria masiva", "Pérdida de clorofila b"], correct: 1, exp: "Para no deshidratarse, las plantas terrestres desarrollaron cutícula protectora y estomas para regular el intercambio gaseoso." },
      { topic: "Histología: Tejidos de Soporte", q: "¿Cuál de los siguientes tejidos de sostén vegetal está compuesto por células MUERTAS en la madurez y dotado de paredes secundarias lignificadas?", opts: ["Parénquima esponjoso", "Colénquima angular", "Esclerénquima (fibras y esclereidas)", "Epidermis con cutícula"], correct: 2, exp: "El esclerénquima muere al madurar y provee soporte rígido definitivo mediante lignina, a diferencia del colénquima vivo y flexible." },
      { topic: "Tejido Vascular", q: "¿Qué células conforman el xilema de las angiospermas para conducir agua y minerales (savia bruta)?", opts: ["Tubos cribosos y células anexas", "Células albuminosas vivas", "Traqueidas y elementos de vaso", "Células oclusivas estomáticas"], correct: 2, exp: "El xilema está formado por traqueidas y elementos de vaso (células huecas y muertas). El floema contiene tubos cribosos vivos." },
      { topic: "Crecimiento Vegetal", q: "El crecimiento secundario en grosor que produce la madera y corteza en plantas leñosas es promovido por:", opts: ["Meristemos apicales radiculares", "Meristemos laterales (cámbium vascular y felógeno)", "Protodermis primaria", "Meristemo fundamental"], correct: 1, exp: "Los meristemos laterales (cámbium vascular y felógeno) originan xilema secundario y peridermis ensanchando los órganos." },
      { topic: "Monocotiledóneas vs. Dicotiledóneas", q: "¿Cuál de los siguientes patrones anatómicos corresponde característicamente a una MONOCOTILEDÓNEA (como la cebolla o la heliconia)?", opts: ["Haces vasculares en tallo dispersos (atactostela) y raíz fasciculada", "Haces vasculares en anillo ordenado (eustela) y raíz pivotante", "Nervadura foliar reticulada y flores pentámeras", "Dos cotiledones y abundante madera secundaria"], correct: 0, exp: "Las monocotiledóneas tienen 1 cotiledón, atactostela (haces dispersos), raíces fasciculadas y nervación paralela." },
      { topic: "Morfología de la Raíz", q: "Los neumatóforos son raíces especializadas que presentan geotropismo negativo y lenticelas. Su función ecológica primordial es:", opts: ["Fijar nitrógeno atmosférico con bacterias", "Captar oxígeno en suelos anegados y pantanosos", "Almacenar grandes cantidades de almidón", "Enroscarse a tallos vecinos"], correct: 1, exp: "Los neumatóforos emergen fuera del agua para ventilar y permitir la respiración radicular en ciénagas y manglares." },
      { topic: "Morfología del Tallo", q: "En el espécimen Allium cepa (cebolla), el verdadero tallo botánico corresponde a:", opts: ["Las hojas verdes cilíndricas", "La raíz pivotante subterránea", "El disco basal achatado y condensado", "La espata protectora"], correct: 2, exp: "El tallo verdadero es el disco basal (platillo) del cual nacen las raíces hacia abajo y los catáfilos carnosos hacia arriba." },
      { topic: "Morfología de la Hoja", q: "Cuando el limbo o lámina foliar se encuentra fraccionado en folíolos articulados a un eje común, la hoja se clasifica como:", opts: ["Hoja sésil", "Hoja simple", "Hoja compuesta", "Hoja acicular"], correct: 2, exp: "Una hoja es compuesta cuando su lámina se fracciona en folíolos individuales. Si posee un solo limbo continuo, es simple." },
      { topic: "Ciclo Diplohaplonte", q: "En el ciclo de alternancia de generaciones de las angiospermas, ¿qué estructura representa al GAMETÓFITO MASCULINO?", opts: ["El estambre completo", "El grano de polen", "El saco embrionario", "El tubo polínico diploide"], correct: 1, exp: "El gametófito masculino haploide (n) está reducido al grano de polen. El saco embrionario es el gametófito femenino." },
      { topic: "Organografía Floral", q: "En una flor hipógina con OVARIO SÚPERO, ¿cómo se insertan los verticilos florales (cáliz, corola y estambres)?", opts: ["Por encima del ovario, quedando este hundido en el receptáculo", "Por debajo del ovario, quedando este libre y expuesto arriba", "Fusionados totalmente a la pared del fruto en formación", "Ausentes por ser gimnosperma"], correct: 1, exp: "En flores hipóginas, el ovario es súpero porque se sitúa por encima del punto donde nacen sépalos, pétalos y estambres." },
      { topic: "Inflorescencias", q: "La inflorescencia típica del girasol (familia Asteraceae), compuesta por un disco común donde se agrupan numerosas flores sésiles, se denomina:", opts: ["Espádice", "Capítulo o cabezuela", "Umbela compuesta", "Panícula ramificada"], correct: 1, exp: "El girasol tiene inflorescencia en capítulo (cabezuela). El espádice es típico del banano y la umbela de la zanahoria." },
      { topic: "Disciplinas Aplicadas", q: "¿Qué rama botánica estudia las causas históricas, climáticas y ecológicas que determinan la distribución geográfica global de las plantas?", opts: ["Fitografía", "Fitogeografía", "Paleobotánica", "Genética vegetal"], correct: 1, exp: "La Fitogeografía explica cómo y por qué las especies y biomas vegetales se distribuyen geográficamente en el planeta." }
    ];
    const prizes = ["$100", "$200", "$300", "$500", "$1,000 🛡️", "$2,000", "$4,000", "$8,000", "$16,000", "$32,000 🛡️", "$64,000", "$125,000", "$250,000", "$500,000", "$1,000,000 🏆"];
    let currentQ = 0;
    let maxUnlockedLevel = 0;
    let answered = false;
    let usedLifelines = { f50: false, phone: false, pub: false };

    function renderLadder() {
      const container = document.getElementById('ladderContainer');
      container.innerHTML = "";
      prizes.forEach((p, idx) => {
        const item = document.createElement('div');
        item.id = `ladder-${idx}`;
        const isSafe = (idx === 4 || idx === 9 || idx === 14);
        let statusIcon = "🔒";
        let statusClass = "opacity-40 bg-slate-950/60 text-slate-500 border-slate-900";
        if (idx === currentQ) { statusIcon = "▶"; statusClass = "active-ladder"; }
        else if (idx < currentQ) { statusIcon = "✓"; statusClass = "bg-emerald-950/40 text-emerald-300 border-emerald-900/60"; }
        else if (idx <= maxUnlockedLevel) { statusIcon = "🔓"; statusClass = "bg-slate-900 text-slate-300 border-slate-800"; }
        item.className = `p-1 sm:p-1.5 px-2.5 rounded-lg flex justify-between items-center border transition-all ${statusClass} ${isSafe && idx !== currentQ ? 'font-bold text-amber-300 border-amber-900/50' : ''}`;
        item.innerHTML = `<span class="flex items-center gap-1.5"><span class="text-[10px]">${statusIcon}</span><span>Nivel ${idx + 1}</span></span><span class="font-semibold">${p}</span>`;
        container.appendChild(item);
      });
      document.getElementById('currentPrize').innerText = currentQ > 0 ? prizes[currentQ - 1] : "$0";
    }

    function loadQuestion() {
      answered = false;
      document.getElementById('feedbackBox').classList.add('hidden');
      const q = questions[currentQ];
      document.getElementById('questionTopic').innerText = q.topic;
      document.getElementById('questionNumber').innerText = `Nivel ${currentQ + 1} de ${questions.length}`;
      document.getElementById('questionText').innerText = q.q;
      for (let i = 0; i < 4; i++) {
        const btn = document.getElementById(`opt${i}`);
        btn.disabled = false;
        btn.className = "btn-opt text-left p-3 sm:p-4 rounded-xl border border-slate-700 flex items-center gap-2.5";
        document.getElementById(`optText${i}`).innerText = q.opts[i];
      }
      renderLadder();
    }

    function chooseOption(idx) {
      if (answered) return;
      answered = true;
      const q = questions[currentQ];
      const selectedBtn = document.getElementById(`opt${idx}`);
      const correctBtn = document.getElementById(`opt${q.correct}`);
      for (let i = 0; i < 4; i++) document.getElementById(`opt${i}`).disabled = true;
      const fbBox = document.getElementById('feedbackBox');
      const fbTitle = document.getElementById('feedbackTitle');
      const fbText = document.getElementById('feedbackText');
      const nextBtn = document.getElementById('nextBtn');
      fbBox.classList.remove('hidden');

      if (idx === q.correct) {
        soundCorrect();
        selectedBtn.classList.remove('btn-opt');
        selectedBtn.classList.add('bg-emerald-600', 'border-emerald-400', 'text-white');
        fbTitle.innerText = "¡CORRECTO! 🎯 Nivel Desbloqueado";
        fbTitle.className = "font-bold text-xs sm:text-sm mb-1 text-emerald-400";
        fbText.innerText = q.exp;
        if (currentQ + 1 > maxUnlockedLevel) maxUnlockedLevel = currentQ + 1;
        if (currentQ === questions.length - 1) {
          nextBtn.innerText = "🎉 ¡Ganaste el Millón! Ver Certificado";
          nextBtn.onclick = showVictory;
        } else {
          nextBtn.innerText = "Avanzar al Siguiente Nivel ➔";
          nextBtn.onclick = nextQuestion;
        }
      } else {
        soundWrong();
        selectedBtn.classList.remove('btn-opt');
        selectedBtn.classList.add('bg-rose-700', 'border-rose-500', 'text-white');
        correctBtn.classList.remove('btn-opt');
        correctBtn.classList.add('bg-emerald-600', 'border-emerald-400', 'text-white');
        let securePrize = currentQ >= 10 ? "$32,000" : (currentQ >= 5 ? "$1,000" : "$0");
        fbTitle.innerText = "RESPUESTA INCORRECTA ❌ (Nivel Bloqueado)";
        fbTitle.className = "font-bold text-xs sm:text-sm mb-1 text-rose-400";
        fbText.innerHTML = `La respuesta correcta era: <strong>${q.opts[q.correct]}</strong>.<br>${q.exp}<br><span class="text-amber-300 font-semibold mt-2 inline-block">Te aseguras: ${securePrize}</span>`;
        nextBtn.innerText = "Volver a Intentar 🔄";
        nextBtn.onclick = restartGame;
      }
      renderLadder();
    }

    function nextQuestion() { currentQ++; loadQuestion(); }
    function restartGame() {
      currentQ = 0;
      usedLifelines = { f50: false, phone: false, pub: false };
      ['life5050', 'lifePhone', 'lifePublic'].forEach(id => {
        const btn = document.getElementById(id);
        btn.disabled = false;
        btn.classList.remove('opacity-30', 'line-through');
      });
      loadQuestion();
    }

    function showVictory() {
      openModal("🏆 ¡FELICITACIONES, MILLONARIO DE LA BOTÁNICA!", 
        "<p class='mb-2'>Has superado con éxito todos los bloqueos y completado los 15 niveles del juego.</p><p class='text-emerald-300 font-semibold'>¡Tienes claros los conceptos para el examen! Éxitos junto a tu equipo.</p>");
    }

    function use5050() {
      if (usedLifelines.f50 || answered) return;
      usedLifelines.f50 = true;
      const btn = document.getElementById('life5050');
      btn.disabled = true;
      btn.classList.add('opacity-30', 'line-through');
      const q = questions[currentQ];
      let incorrect = [0, 1, 2, 3].filter(i => i !== q.correct).sort(() => Math.random() - 0.5);
      document.getElementById(`opt${incorrect[0]}`).disabled = true;
      document.getElementById(`opt${incorrect[0]}`).classList.add('opacity-20');
      document.getElementById(`opt${incorrect[1]}`).disabled = true;
      document.getElementById(`opt${incorrect[1]}`).classList.add('opacity-20');
    }

    function usePhone() {
      if (usedLifelines.phone || answered) return;
      usedLifelines.phone = true;
      const btn = document.getElementById('lifePhone');
      btn.disabled = true;
      btn.classList.add('opacity-30', 'line-through');
      const q = questions[currentQ];
      const partners = ["Litzy Agudelo", "Ximena Alzate", "Laura Curequia"];
      const chosen = partners[Math.floor(Math.random() * partners.length)];
      const letters = ["A", "B", "C", "D"];
      openModal(`📞 Llamada a ${chosen}`, `<em>"Hola Juan David, revisé mis apuntes del laboratorio y la respuesta correcta es la <strong>opción ${letters[q.correct]}: ${q.opts[q.correct]}</strong>."</em>`);
    }

    function usePublic() {
      if (usedLifelines.pub || answered) return;
      usedLifelines.pub = true;
      const btn = document.getElementById('lifePublic');
      btn.disabled = true;
      btn.classList.add('opacity-30', 'line-through');
      const q = questions[currentQ];
      const letters = ["A", "B", "C", "D"];
      let html = `<div class='space-y-2 text-left'>`;
      letters.forEach((l, i) => {
        const val = (i === q.correct) ? 72 : (i === 1 ? 12 : 8);
        html += `<div><div class='flex justify-between text-xs mb-1'><span>Opción ${l}</span><span>${val}%</span></div><div class='w-full bg-slate-800 rounded-full h-2'><div class='bg-amber-400 h-2 rounded-full' style='width: ${val}%'></div></div></div>`;
      });
      html += `</div>`;
      openModal("📊 Votación del Salón", html);
    }

    function openModal(title, html) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }
    loadQuestion();
  </script>
</body>
</html>
